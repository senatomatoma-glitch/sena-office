<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>세나 비서실 · SENA AI OFFICE</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="세나 비서실">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #FAF4EB; --card: #FFFDF9; --border: #EADBC8; --brown: #5C3A21;
    --accent: #A0522D; --accent-light: #F3E5D3; --green: #1E9E63; --green-bg: #E7F7EF;
    --orange: #D97706; --orange-bg: #FEF3C7; --blue: #2563EB; --blue-bg: #EFF6FF;
    --red: #DC2626; --red-bg: #FEE2E2; --muted: #8C7A6B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    background: var(--bg); color: var(--brown); max-width: 560px; margin: 0 auto; padding-bottom: 48px;
  }
  .lock-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .lock-box {
    width: 100%; max-width: 360px; background: var(--card); border: 1.5px solid var(--border);
    border-radius: 24px; padding: 28px 22px; text-align: center;
    box-shadow: 0 12px 32px rgba(92,58,33,.10);
  }
  .lock-icon { width: 76px; height: 76px; border-radius: 18px; margin-bottom: 12px; border: 1.5px solid var(--border); }
  .lock-box h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
  .lock-box p { font-size: 12.5px; color: var(--muted); margin-bottom: 18px; }
  .pin-input {
    width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--border);
    font-size: 18px; text-align: center; letter-spacing: 6px; font-weight: 800;
    color: var(--brown); background: #FAF4EB; outline: none; margin-bottom: 12px;
  }
  .pin-btn {
    width: 100%; padding: 12px; border: none; border-radius: 14px;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 800; cursor: pointer;
  }
  .remember-row {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: var(--muted); margin-top: 12px;
  }
  .err-msg { font-size: 12px; color: var(--red); margin-top: 10px; min-height: 16px; font-weight: 700; }
  #app { display: none; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .crown {
    width: 40px; height: 40px; border-radius: 50%; background: #F6E6D0; border: 2px solid #E2C59E;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .brand-title { font-size: 18px; font-weight: 800; }
  .brand-sub { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .dot-green { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
  .lock-mini {
    background: var(--card); color: var(--brown); border: 1px solid var(--border);
    padding: 6px 11px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  nav { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 4px 12px 12px; }
  .s-card { display: flex; gap: 11px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 11px; margin-bottom: 9px; align-items: flex-start; }
  .s-img { width: 74px; height: 96px; object-fit: cover; border-radius: 12px; background: #EFE3D3; flex-shrink: 0; }
  .s-body { flex: 1; min-width: 0; }
  .s-actions { display: flex; gap: 6px; margin-top: 7px; }
  .s-btn { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 9px; text-decoration: none; border: 1px solid var(--border); background: #FAF4EB; color: var(--brown); }
  .s-btn.call { background: var(--green-bg); color: var(--green); border-color: #B7E4CE; }
  .tab-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--brown);
    padding: 8px 1px; border-radius: 13px; font-size: 10.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .banner {
    margin: 0 14px 12px; padding: 13px 15px; border-radius: 18px;
    background: linear-gradient(135deg, #FBF2E6, #F6E9D7); border: 1px solid var(--border);
  }
  .banner-tag {
    display: inline-block; background: #fff; padding: 3px 10px; border-radius: 12px;
    font-size: 11px; font-weight: 700; margin-bottom: 6px; border: 1px solid var(--border);
  }
  .banner h2 { font-size: 15.5px; font-weight: 800; margin-bottom: 4px; }
  .banner p { font-size: 12px; color: var(--muted); }
  .map-wrap {
    position: relative; margin: 0 14px 14px; border-radius: 22px; overflow: hidden;
    border: 2px solid var(--border); box-shadow: 0 8px 24px rgba(92,58,33,.10); background: #F5EAD9;
  }
  .map-wrap img { width: 100%; display: block; }
  .pin {
    position: absolute; transform: translate(-50%, -50%);
    background: rgba(255,253,249,0.92); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid rgba(216,184,148,0.9);
    border-radius: 12px; padding: 3px 8px; font-size: 10.5px; font-weight: 800;
    color: var(--brown); box-shadow: 0 3px 10px rgba(0,0,0,.20);
    cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px;
  }
  .pin .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .head-bubble {
    position: absolute; transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.96); border: 1.5px solid #C97A40;
    border-radius: 10px; padding: 2px 7px; font-size: 9.5px; font-weight: 800;
    color: #5C3A21; box-shadow: 0 2px 8px rgba(0,0,0,.18);
    cursor: pointer; white-space: nowrap; z-index: 3;
  }
  .head-bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%);
    border-width: 5px 4px 0 4px; border-style: solid;
    border-color: rgba(255,255,255,0.96) transparent transparent transparent;
  }
  .head-bubble.boss { border-color: #D9383A; color: #D9383A; background: #FFF5F5; }
  .head-bubble.boss::after { border-color: #FFF5F5 transparent transparent transparent; }
  .section { display: none; padding: 0 14px; }
  .section.active { display: block; }
  .subhead { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 8px; }
  .subhead h3 { font-size: 15px; font-weight: 800; }
  .subhead span { font-size: 12px; color: var(--muted); font-weight: 700; }
  .stat-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .stat-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 4px; text-align: center; cursor: pointer;
  }
  .stat-box.active { border-color: var(--accent); background: #FDF6EC; }
  .stat-num { font-size: 16px; font-weight: 800; }
  .stat-lbl { font-size: 10px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 14px; margin-bottom: 9px; cursor: pointer;
  }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 6px; font-size: 12.5px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
  .b-run { background: var(--blue-bg); color: var(--blue); }
  .b-ver { background: var(--orange-bg); color: var(--orange); }
  .b-dec { background: var(--red-bg); color: var(--red); }
  .b-hold { background: #F3F4F6; color: #4B5563; }
  .b-done { background: var(--green-bg); color: var(--green); }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; }
  .f-btn {
    border: 1px solid var(--border); background: var(--card); padding: 5px 11px;
    border-radius: 14px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .f-btn.active { background: var(--brown); color: #fff; border-color: var(--brown); }
  .search-input {
    width: 100%; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); font-size: 13px; color: var(--brown); margin-bottom: 10px; outline: none;
  }
  .member-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .m-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 13px; cursor: pointer; }
  .m-card h3 { font-size: 15px; margin-bottom: 3px; }
  .m-dept { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .m-role { font-size: 11px; color: var(--muted); margin-bottom: 8px; line-height: 1.35; }
  .m-stat { font-size: 12px; font-weight: 700; }
  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(40,24,12,.48);
    z-index: 99; align-items: flex-end; justify-content: center;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 560px; max-height: 82vh;
    border-radius: 22px 22px 0 0; padding: 18px 16px 28px; overflow-y: auto;
  }
  .modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; }
  .close-btn {
    border: none; background: var(--accent-light); color: var(--brown); flex-shrink: 0;
    width: 30px; height: 30px; border-radius: 50%; font-weight: 800; cursor: pointer;
  }
  .t-title { font-size: 13px; font-weight: 700; line-height: 1.42; }
  .t-meta { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
  .t-memo-preview {
    font-size: 11.5px; color: #5E4B3B; background: #FBF6EE; border-radius: 8px;
    padding: 6px 9px; margin-top: 6px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .op-text { font-size: 12px; line-height: 1.5; white-space: pre-line; color: #4A3525; margin-top: 6px; }
  .memo-full {
    font-size: 12.5px; line-height: 1.55; white-space: pre-line; color: #3D2B1D;
    background: #FBF6EE; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-top: 10px;
  }
</style>
</head>
<body>
<div id="lock-screen" class="lock-screen">
  <div class="lock-box">
    <img class="lock-icon" src="icon.png" alt="세나 비서실">
    <h1>🔒 세나 비서실</h1>
    <p>AES-256 암호화 보호 중 · 비밀번호를 입력해 주세요</p>
    <input id="pin-input" class="pin-input" type="password" inputmode="numeric" placeholder="••••" onkeydown="if(event.key==='Enter') unlock()">
    <button class="pin-btn" onclick="unlock()">열기</button>
    <label class="remember-row"><input type="checkbox" id="remember-chk" checked> 이 기기에서 기억하기</label>
    <div id="err-msg" class="err-msg"></div>
  </div>
</div>

<div id="app">
  <header>
    <div class="brand">
      <div class="crown">👑</div>
      <div>
        <div class="brand-title">세나 비서실</div>
        <div class="brand-sub"><span class="dot-green"></span> <span id="hdr-sub">부서별 5실</span></div>
      </div>
    </div>
    <button class="lock-mini" onclick="lockNow()">🔒 잠금</button>
  </header>

  <nav>
    <button class="tab-btn active" onclick="showTab('map', this)">🗺️ 맵</button>
    <button class="tab-btn" onclick="showTab('approval', this)">👑 승인 <span id="nav-app-cnt" style="background:#FF4D4F;color:#fff;border-radius:10px;padding:1px 5px;font-size:9px;display:none;">0</span></button>
    <button class="tab-btn" onclick="showTab('queue', this)">📋 큐</button>
    <button class="tab-btn" onclick="showTab('meeting', this)">💬 회의</button>
    <button class="tab-btn" onclick="showTab('status', this)">📊 부서</button>
    <button class="tab-btn" onclick="showTab('secret', this)">🤫 비밀</button>
  </nav>

  <div id="tab-map" class="section active" style="padding:0;">
    <div class="banner">
      <div class="banner-tag">👑 부서별 5실 완비</div>
      <h2>세나 대장님, 각 부서 방을 눌러 봐!</h2>
      <p>방 캐릭터를 누르면 담당 업무가, 아래 접수 큐 카드를 누르면 상세 메모까지 전부 열려요.</p>
    </div>
    <div class="map-wrap">
      <img src="office.png" alt="세나 비서실 부서별 3D 클레이 오피스">
      <button class="head-bubble boss" id="hb-세나" style="left:49%;top:7%;" onclick="showTab('approval', document.querySelectorAll('.tab-btn')[1])">👑 승인 0건</button>
      <button class="head-bubble" id="hb-미향" style="left:25%;top:37%;" onclick="openMember('미향')">💬 ...</button>
      <button class="head-bubble" id="hb-미유" style="left:74%;top:39%;" onclick="openMember('미유')">💬 ...</button>
      <button class="head-bubble" id="hb-아카네" style="left:26%;top:68%;" onclick="openMember('아카네')">💬 ...</button>
      <button class="head-bubble" id="hb-아이미" style="left:74%;top:69%;" onclick="openMember('아이미')">💬 ...</button>
      <button class="pin" style="left:49%;top:31%;" onclick="openBoss()"><span class="pulse"></span>🐯 대장실 · 세나</button>
      <button class="pin" style="left:24%;top:58%;" onclick="openMember('미향')"><span class="pulse"></span>💙 총대장실 · 미향</button>
      <button class="pin" style="left:74%;top:60%;" onclick="openMember('미유')"><span class="pulse"></span>🦉 블로그실 · 미유</button>
      <button class="pin" style="left:26%;top:91%;" onclick="openMember('아카네')"><span class="pulse"></span>🦊 숙박메일실 · 아카네</button>
      <button class="pin" style="left:74%;top:91%;" onclick="openMember('아이미')"><span class="pulse"></span>🐱 전략데이터실 · 아이미</button>
    </div>
    <div style="padding:0 14px;">
      <div class="subhead"><h3>📋 실시간 접수 큐</h3><span id="map-q-count"></span></div>
      <div class="stat-strip" id="map-stat-strip"></div>
      <div id="map-queue-list"></div>
    </div>
  </div>

  <div id="tab-approval" class="section">
    <div class="banner" style="border-radius:14px;margin-bottom:12px;padding:12px 14px;">
      <div class="banner-tag">👑 대표 최종 승인 · 적용 대기</div>
      <h2 style="font-size:15px;">세나야가 직접 확인·적용할 건만 모았어</h2>
      <p style="font-size:11px;">상태가 ‘결정 필요’이거나 최종 적용·승인이 필요한 티켓이야. 누르면 상세 내용과 링크가 열려요.</p>
    </div>
    <div id="approval-list"></div>
  </div>

  <div id="tab-queue" class="section">
    <input class="search-input" id="q-search" type="text" placeholder="🔍 티켓번호(T-168), 제목, 내용 검색..." oninput="renderQueue()">
    <div class="filter-row" id="status-filters">
      <button class="f-btn active" onclick="setQStatus('전체', this)">전체</button>
      <button class="f-btn" onclick="setQStatus('결정 필요', this)">🔴 결정필요</button>
      <button class="f-btn" onclick="setQStatus('실행 중', this)">🔵 실행중</button>
      <button class="f-btn" onclick="setQStatus('검증 중', this)">🟠 검증중</button>
      <button class="f-btn" onclick="setQStatus('보류', this)">⚪ 보류</button>
    </div>
    <div class="filter-row" id="owner-filters">
      <button class="f-btn active" onclick="setQOwner('전체', this)">전원</button>
      <button class="f-btn" onclick="setQOwner('미향', this)">미향</button>
      <button class="f-btn" onclick="setQOwner('미유', this)">미유</button>
      <button class="f-btn" onclick="setQOwner('아카네', this)">아카네</button>
      <button class="f-btn" onclick="setQOwner('아이미', this)">아이미</button>
    </div>
    <div id="queue-list"></div>
  </div>

  <div id="tab-meeting" class="section"><div id="opinions-list"></div></div>
  <div id="tab-status" class="section"><div class="member-grid" id="member-cards"></div></div>
  <div id="tab-secret" class="section">
    <div id="secret-lock" class="lock-box" style="margin:12px auto;">
      <h1>🤫 비밀놀이 잠금</h1>
      <p>전용 비밀번호를 입력해 주세요</p>
      <input id="sec-pin" class="pin-input" type="password" inputmode="numeric" placeholder="••••" onkeydown="if(event.key==='Enter') unlockSecret()">
      <button class="pin-btn" onclick="unlockSecret()">열기</button>
      <div id="sec-err" class="err-msg"></div>
    </div>
    <div id="secret-view" style="display:none;">
      <div class="subhead"><h3 id="sec-title">🤫 비밀놀이</h3><button class="lock-mini" onclick="lockSecret()">🔒 잠금</button></div>
      <input class="search-input" id="s-search" type="text" placeholder="🔍 이름, 가게, 지역, 컵 검색..." oninput="renderSecret()">
      <div class="filter-row" id="sec-filters">
        <button class="f-btn active" onclick="setSecFilter('전체', this)">전체</button>
        <button class="f-btn" onclick="setSecFilter('🟢', this)">🟢 지금가능</button>
        <button class="f-btn" onclick="setSecFilter('🟡', this)">🟡 오늘예정</button>
      </div>
      <div id="secret-list"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div class="modal-top"><h3 id="modal-title" style="font-size:16px;"></h3><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div id="modal-body"></div>
  </div>

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

async function tryDecrypt(pw) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(ENC.s), iterations: 100000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(ENC.i) }, key, b64ToBytes(ENC.c));
  return JSON.parse(new TextDecoder().decode(dec));
}

async function unlock(autoPw) {
  const pw = autoPw ?? document.getElementById('pin-input').value.trim();
  if (!pw) return;
  try {

    document.getElementById('err-msg').innerText = '비밀번호가 맞지 않아!';
  }
}

let curMapStatus = '전체', curQStatus = '전체', curQOwner = '전체';
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function statusBadge(s) {
  if (!s) return '<span class="badge b-hold">접수</span>';
  if (s.includes('결정')) return `<span class="badge b-dec">${esc(s)}</span>`;
  if (s.includes('실행')) return `<span class="badge b-run">${esc(s)}</span>`;
  if (s.includes('검증')) return `<span class="badge b-ver">${esc(s)}</span>`;
  if (s.includes('완료')) return `<span class="badge b-done">${esc(s)}</span>`;
  return `<span class="badge b-hold">${esc(s)}</span>`;
}
function showTab(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
}
function ticketCardHtml(t, idx) {
  const m = esc((t.memo || '').replace(/\n+/g, ' ').slice(0, 140));
  return `<div class="card" onclick="openTicket(${idx})">
    <div class="card-head"><strong>${esc(t.ticket||'-')} · ${esc(t.area)} · ${esc(t.type)}</strong>${statusBadge(t.status)}</div>
    <div class="t-title">${esc(t.title)}</div>
    <div class="t-meta">실행: <b>${esc(t.owner||'-')}</b> · 검증: <b>${esc(t.verifier||'-')}</b> · 마감: ${esc(t.deadline||'-')}</div>
    ${m ? `<div class="t-memo-preview">${m}</div>` : ''}
  </div>`;
}
function renderMapQueue() {
  const counts = {
    '전체': DATA.tickets.length,
    '결정 필요': DATA.tickets.filter(t => t.status === '결정 필요').length,
    '실행 중': DATA.tickets.filter(t => t.status === '실행 중').length,
    '검증 중': DATA.tickets.filter(t => t.status === '검증 중').length,
    '보류': DATA.tickets.filter(t => t.status === '보류' || t.status === '접수').length,
  };
  document.getElementById('map-q-count').innerText = `총 ${DATA.tickets.length}건 (누르면 상세)`;
  document.getElementById('map-stat-strip').innerHTML = Object.entries(counts).map(([k,v]) =>
    `<div class="stat-box ${curMapStatus===k?'active':''}" onclick="curMapStatus='${k}';renderMapQueue();"><div class="stat-num">${v}</div><div class="stat-lbl">${k}</div></div>`
  ).join('');
  const list = DATA.tickets.map((t,i)=>({t,i})).filter(({t})=> curMapStatus==='전체' ? true : (curMapStatus==='보류' ? (t.status==='보류'||t.status==='접수') : t.status===curMapStatus));
  document.getElementById('map-queue-list').innerHTML = list.map(({t,i})=>ticketCardHtml(t,i)).join('');
}
function renderMapBubbles() {
  const appCnt = DATA.tickets.filter(t => isNeedApproval(t)).length;
  const bossEl = document.getElementById('hb-세나');
  if (bossEl) bossEl.innerText = appCnt > 0 ? `👑 대표승인 ${appCnt}건` : '👑 대기 0건';
  ['미향', '미유', '아카네', '아이미'].forEach(name => {
    const el = document.getElementById('hb-' + name);
    if (!el) return;
    const run = DATA.tickets.filter(t => t.owner === name && t.status === '실행 중');
    const ver = DATA.tickets.filter(t => t.verifier === name && t.status === '검증 중');
    const pool = run.length ? run : ver;
    const tag = run.length ? '💬' : (ver.length ? '🔍' : '☕');
    if (!pool.length) {
      el.innerText = `${tag} 대기중`;
      return;
    }
    const sorted = [...pool].sort((a,b) => ((a.type==='단발'?0:1) - (b.type==='단발'?0:1)));
    const ids = sorted.map(t => (t.ticket || '').trim()).filter(Boolean);
    if (ids.length === 1) el.innerText = `${tag} ${ids[0]}`;
    else if (ids.length === 2) el.innerText = `${tag} ${ids[0]}·${ids[1].replace('T-','')}`;
    else if (ids.length > 2) el.innerText = `${tag} ${ids[0]} 외 ${ids.length - 1}`;
    else el.innerText = `${tag} ${pool.length}건`;
  });
}
function isNeedApproval(t) {

function shortApprovalAction(t) {
  const tk = (t.ticket || '').trim();

  if (tk === 'T-070') return 'Travelpayouts PayPal(Sonuk Yamada) 결제 확인 링크 클릭 승인해줘!';
  const m = (t.memo || '');
  const tag = m.match(/\[(?:세나\s*할\s*일|대표\s*승인|결론)\s*:\s*([^\]]+)\]/);
  if (tag) return tag[1].trim();

let SEC_DATA = null, curSecFilter = '전체';
async function unlockSecret() {
  const pw = document.getElementById('sec-pin').value.trim();
  if (!pw) return;
  try {
    const res = await fetch('secret_enc.json?t=' + Date.now());
    const encObj = await res.json();
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64ToBytes(encObj.s), iterations: 100000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(encObj.i) }, key, b64ToBytes(encObj.c));
    SEC_DATA = JSON.parse(new TextDecoder().decode(dec));
    document.getElementById('secret-lock').style.display = 'none';
    document.getElementById('secret-view').style.display = 'block';
    document.getElementById('sec-title').innerText = `🤫 ${SEC_DATA.updated} (🟢${SEC_DATA.counts.green} · 🟡${SEC_DATA.counts.yellow})`;
    renderSecret();
  } catch (e) {
    document.getElementById('sec-err').innerText = '비밀번호가 맞지 않아!';
  }
}
function lockSecret() {
  SEC_DATA = null;
  document.getElementById('sec-pin').value = '';
  document.getElementById('secret-view').style.display = 'none';
  document.getElementById('secret-lock').style.display = 'block';
}
function setSecFilter(f, btn) {
  curSecFilter = f;
  document.querySelectorAll('#sec-filters .f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSecret();
}
function renderSecret() {
  if (!SEC_DATA) return;
  const kw = (document.getElementById('s-search')?.value || '').trim().toLowerCase();
  const list = SEC_DATA.items.filter(x => {
    if (curSecFilter !== '전체' && x.status !== curSecFilter) return false;
    if (kw && !`${x.name} ${x.shop} ${x.area} ${x.cup} ${x.tag}`.toLowerCase().includes(kw)) return false;
    return true;
  });
  document.getElementById('secret-list').innerHTML = list.map(x => `
    <div class="s-card">
      ${x.img ? `<img class="s-img" src="${esc(x.img)}" referrerpolicy="no-referrer" loading="lazy" alt="">` : `<div class="s-img"></div>`}
      <div class="s-body">
        <div class="card-head" style="margin-bottom:3px;">
          <strong>${esc(x.status)} ${esc(x.name)}</strong>
          ${x.tag ? `<span class="badge b-ver">${esc(x.tag)}</span>` : ''}
        </div>
        <div class="t-meta" style="margin-top:0;">${x.age ? x.age+'세 · ' : ''}${x.cup ? x.cup+'컵 · ' : ''}${x.height ? x.height+'cm' : ''}</div>
        <div class="t-title" style="font-size:12.5px;margin-top:3px;">${esc(x.shop)} (${esc(x.area)})</div>
        <div class="t-meta">${esc(x.today)} ${x.price ? '· '+esc(x.price) : ''}</div>
        <div class="s-actions">
          ${x.phone ? `<a class="s-btn call" href="tel:${esc(x.phone)}">📞 ${esc(x.phone)}</a>` : ''}
          ${x.url ? `<a class="s-btn" href="${esc(x.url)}" target="_blank">🔗 프로필</a>` : ''}
        </div>
      </div>
    </div>
  `).join('') || '<p class="t-meta" style="text-align:center;padding:24px;">조건에 맞는 후보가 없어.</p>';
}
const saved = localStorage.getItem('sena_office_pin');
if (saved) unlock(saved);
