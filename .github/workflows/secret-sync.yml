name: Secret Sync (5m)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install cryptography pillow
      - run: python3 scripts/run_secret_sync.py
        env:
          SECRET_PIN: ${{ secrets.SECRET_PIN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add secret_enc.json
          git diff --cached --quiet || (git commit -m "Update secret_enc.json" && git push)
